name: Update demo GIF

on:
  push:
    branches: [main]
    paths:
      - tg_cleaner.py
      - media/make_demo.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-demo
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install aiohttp telethon playwright pillow
          playwright install --with-deps chromium

      - name: Generate demo.gif
        run: python media/make_demo.py

      - name: Commit updated GIF
        run: |
          if git diff --quiet -- media/demo.gif; then
            echo "demo.gif unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/demo.gif
          git commit -m "Update demo.gif [skip ci]"
          git pull --rebase origin main
          git push
